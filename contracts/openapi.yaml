openapi: 3.1.0
info:
  title: Mosque Prayer TV Synchronization API
  version: 0.8.0
  description: >-
    Draft contract for pairing a television, retrieving a small manifest,
    downloading an immutable signed prayer-time snapshot, and reporting
    privacy-safe device health. The TV display remains functional from local
    storage when this API is unavailable.
servers:
  - url: https://api.example.invalid
security:
  - deviceBearer: []
paths:
  /v1/devices/pair:
    post:
      operationId: pairDevice
      security: []
      summary: Exchange a short-lived pairing code for scoped device credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairRequest'
      responses:
        '200':
          description: Device paired
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/devices/{deviceId}/manifest:
    get:
      operationId: getDeviceManifest
      summary: Get the currently assigned snapshot and asset metadata
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Current manifest
          headers:
            ETag:
              schema:
                type: string
            Date:
              description: Server response time in IMF-fixdate form; diagnostic only.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceManifest'
        '304':
          description: Manifest unchanged
          headers:
            Date:
              description: Server response time in IMF-fixdate form; diagnostic only.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/snapshots/{snapshotId}:
    get:
      operationId: downloadSnapshot
      summary: Download an immutable signed snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Snapshot body conforming to prayer-snapshot.schema.json
          headers:
            ETag:
              schema:
                type: string
            Digest:
              schema:
                type: string
              description: Base64 SHA-256 of the exact response bytes.
          content:
            application/json:
              schema:
                $ref: './prayer-snapshot.schema.json'
        '304':
          description: Cached representation is current
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/devices/{deviceId}/heartbeat:
    post:
      operationId: postDeviceHeartbeat
      summary: Report privacy-safe operational health
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '204':
          description: Accepted
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/devices:
    get:
      operationId: listFleetDevices
      security:
        - adminBearer: []
      summary: List devices visible to an authorized mosque-scoped actor
      parameters:
        - $ref: '#/components/parameters/MosqueId'
      responses:
        '200':
          description: Scoped device list without credentials or pairing codes
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetDevice'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/pairing-codes:
    post:
      operationId: issueFleetPairingCode
      security:
        - adminBearer: []
      summary: Issue an expiring one-use pairing code in an authorized mosque
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminIssuePairingRequest'
      responses:
        '201':
          description: Pairing code created or the identical idempotent result reproduced
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIssuePairingResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/devices/{deviceId}/revoke:
    post:
      operationId: revokeFleetDevice
      security:
        - adminBearer: []
      summary: Revoke a device credential in an authorized mosque
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonRequest'
      responses:
        '204':
          description: Device revoked; an identical retry is a no-op
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/devices/{deviceId}/assignment:
    put:
      operationId: assignFleetDeviceSnapshot
      security:
        - adminBearer: []
      summary: Assign a pre-verified immutable snapshot to an authorized device
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAssignmentRequest'
      responses:
        '200':
          description: Durable assignment and manifest version
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAssignment'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/devices/{deviceId}/rollout-group:
    put:
      operationId: setFleetDeviceRolloutGroup
      security:
        - adminBearer: []
      summary: Set or clear a bounded server-side rollout cohort label
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRolloutGroupRequest'
      responses:
        '204':
          description: Cohort label changed or an identical retry accepted
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/devices/{deviceId}/support-bundle:
    get:
      operationId: getFleetDeviceSupportBundle
      security:
        - adminBearer: []
      summary: Read one bounded current-state diagnostic bundle without logs or credentials
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Privacy-safe current device support state
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSupportBundle'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/setup/cities:
    get:
      operationId: searchSetupCities
      security:
        - adminBearer: []
      summary: Return every exact canonical or alias match for explicit operator selection
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Deterministically ordered candidates; duplicate names are never auto-selected
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitySearchResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/setup/prayer-policy:
    get:
      operationId: resolveSetupPrayerPolicy
      security:
        - adminBearer: []
      summary: Resolve one explicitly selected canonical city for the scoped mosque and local date
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - name: city_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One approved executable binding from the active registry revision
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerPolicyResolution'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/setup/prayer-policy-options:
    get:
      operationId: assessSetupPrayerPolicyOptions
      security:
        - adminBearer: []
      summary: Explain every applicable policy option from one immutable registry revision
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - name: revision_id
          in: query
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 160
        - name: city_id
          in: query
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 160
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Deterministic precedence, freshness and blocked-reason explanation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerPolicyOptionsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/setup/prayer-policy-binding-requests:
    post:
      operationId: requestSetupPrayerPolicyBinding
      security:
        - adminBearer: []
      summary: Persist an explicit selectable staged-policy choice for separate review
      description: >-
        This append-only request remains pending_review. It does not activate a registry
        revision, approve a policy, publish a snapshot, or change a device assignment.
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryBindingRequestInput'
      responses:
        '201':
          description: Append-only pending-review request created or idempotently replayed
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryBindingRequestResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /v1/admin/mosques/{mosqueId}/rollout-groups/{groupId}/assignment:
    put:
      operationId: assignFleetRolloutGroupSnapshot
      security:
        - adminBearer: []
      summary: Atomically assign a pre-verified snapshot to at most 100 cohort devices
      parameters:
        - $ref: '#/components/parameters/MosqueId'
        - $ref: '#/components/parameters/RolloutGroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAssignmentRequest'
      responses:
        '200':
          description: Exact durable per-device assignments in deterministic device order
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutAssignmentResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
components:
  headers:
    NoStore:
      description: Sensitive response must not be stored by shared or private caches.
      schema:
        type: string
        const: no-store
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-admin-token
  parameters:
    MosqueId:
      name: mosqueId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RolloutGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: >-
        Random non-secret retry key. Identical results are guaranteed for 24
        hours; reuse with changed input or after expiry returns 409.
  responses:
    ErrorResponse:
      description: Stable machine-readable error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    CitySearchResponse:
      type: object
      additionalProperties: false
      required: [schema_version, query, candidates]
      properties:
        schema_version:
          const: city-search/v1
        query:
          type: string
          minLength: 1
          maxLength: 200
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CityCandidate'
    CityCandidate:
      type: object
      additionalProperties: false
      required:
        - city_id
        - canonical_name
        - aliases
        - federal_subject_code
        - federal_subject_name
        - settlement_type
        - timezone
        - latitude
        - longitude
        - geographic_source_id
        - geographic_revision
        - geographic_license
      properties:
        city_id:
          type: string
          minLength: 1
          maxLength: 160
        canonical_name:
          type: string
          minLength: 1
          maxLength: 240
        aliases:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 240
        federal_subject_code:
          type: string
          pattern: '^RU-[A-Z]{2,3}$'
        federal_subject_name:
          type: string
          minLength: 1
          maxLength: 240
        settlement_type:
          type: string
          minLength: 1
          maxLength: 32
        timezone:
          type: string
          minLength: 3
          maxLength: 64
          description: Named IANA timezone ID; fixed numeric offsets are invalid.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        geographic_source_id:
          type: string
          minLength: 1
          maxLength: 200
        geographic_revision:
          type: string
          minLength: 1
          maxLength: 200
        geographic_license:
          type: string
          minLength: 1
          maxLength: 200
    PrayerPolicyResolution:
      type: object
      additionalProperties: false
      required: [schema_version, status, tier, city, scope, authorities, source, policy, source_overrides]
      oneOf:
        - required: [timetable]
          not:
            required: [calculation_profile]
        - required: [calculation_profile]
          not:
            required: [timetable]
      properties:
        schema_version:
          const: prayer-policy-resolution/v1
        status:
          const: resolved
        tier:
          type: string
          enum:
            - exact_city_timetable
            - regional_official_timetable
            - approved_regional_calculation_profile
            - explicitly_configured_fallback
        city:
          $ref: '#/components/schemas/CityCandidate'
        scope:
          $ref: '#/components/schemas/GeographicScope'
        authorities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PrayerAuthority'
        source:
          $ref: '#/components/schemas/RegistryPrayerSource'
        policy:
          $ref: '#/components/schemas/RegistryPrayerPolicy'
        timetable:
          $ref: '#/components/schemas/RegistryTimeTable'
        calculation_profile:
          $ref: '#/components/schemas/RegistryCalculationProfile'
        source_overrides:
          type: array
          items:
            $ref: '#/components/schemas/RegistrySourceOverride'
    PrayerPolicyOptionsResponse:
      type: object
      additionalProperties: false
      required: [schema_version, revision, revision_state, status, reason, date, city, options, allowed_actions]
      properties:
        schema_version:
          const: prayer-policy-options/v1
        revision:
          $ref: '#/components/schemas/RegistryRevision'
        revision_state:
          type: string
          enum: [staged, active]
        status:
          type: string
          enum: [resolved, ambiguous, stale, unavailable]
        reason:
          type: string
          enum:
            - resolved
            - same_tier_ambiguous
            - stale_source
            - source_unavailable
            - source_not_approved
            - schedule_unavailable
            - policy_out_of_range
            - no_policy
        date:
          type: string
          format: date
        city:
          $ref: '#/components/schemas/CityCandidate'
        options:
          type: array
          items:
            $ref: '#/components/schemas/RegistryPolicyOption'
        allowed_actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [request_binding]
    RegistryRevision:
      type: object
      additionalProperties: false
      required: [id, schema_version, catalog_revision_id, content_sha256, created_at, created_by, reason]
      properties:
        id:
          type: string
        schema_version:
          type: integer
          minimum: 1
        parent_revision_id:
          type: string
        catalog_revision_id:
          type: string
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        reason:
          type: string
    RegistryPolicyOption:
      type: object
      additionalProperties: false
      required: [tier, selectable, blocked_reason, scope, authorities, source, policy, source_overrides]
      properties:
        tier:
          type: string
          enum:
            - exact_city_timetable
            - regional_official_timetable
            - approved_regional_calculation_profile
            - explicitly_configured_fallback
        selectable:
          type: boolean
        blocked_reason:
          type: string
          enum:
            - eligible
            - lower_precedence
            - policy_out_of_range
            - source_research_only
            - source_stale
            - source_not_fresh_for_date
            - source_unavailable
            - schedule_unavailable_for_date
        scope:
          $ref: '#/components/schemas/GeographicScope'
        authorities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PrayerAuthority'
        source:
          $ref: '#/components/schemas/RegistryPrayerSource'
        policy:
          $ref: '#/components/schemas/RegistryPrayerPolicy'
        timetable:
          $ref: '#/components/schemas/RegistryTimeTable'
        calculation_profile:
          $ref: '#/components/schemas/RegistryCalculationProfile'
        source_overrides:
          type: array
          items:
            $ref: '#/components/schemas/RegistrySourceOverride'
    RegistryBindingRequestInput:
      type: object
      additionalProperties: false
      required: [revision_id, city_id, policy_id, date, reason]
      properties:
        revision_id:
          type: string
          minLength: 8
          maxLength: 160
        city_id:
          type: string
          minLength: 8
          maxLength: 160
        policy_id:
          type: string
          minLength: 8
          maxLength: 160
        date:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 512
    RegistryBindingRequestResponse:
      type: object
      additionalProperties: false
      required: [schema_version, request]
      properties:
        schema_version:
          const: registry-binding-request/v1
        request:
          $ref: '#/components/schemas/RegistryBindingRequest'
    RegistryBindingRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - revision_id
        - city_id
        - policy_id
        - mosque_id
        - date
        - resolution_tier
        - status
        - selection_sha256
        - requested_by_actor_id
        - reason
        - request_id
        - requested_at
      properties:
        id:
          type: string
        revision_id:
          type: string
        city_id:
          type: string
        policy_id:
          type: string
        mosque_id:
          type: string
        date:
          type: string
          format: date
        resolution_tier:
          type: string
          enum:
            - exact_city_timetable
            - regional_official_timetable
            - approved_regional_calculation_profile
            - explicitly_configured_fallback
        status:
          const: pending_review
        selection_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        requested_by_actor_id:

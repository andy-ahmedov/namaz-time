      properties:
        id:
          type: string
        source_id:
          type: string
        geographic_scope_id:
          type: string
        mosque_id:
          type: string
        timezone:
          type: string
          minLength: 3
          maxLength: 64
        effective:
          $ref: '#/components/schemas/DateRange'
        published_snapshot_id:
          type: string
        source_override_ids:
          type: array
          uniqueItems: true
          items:
            type: string
    RegistryCalculationProfile:
      type: object
      additionalProperties: false
      required: [id, source_id, geographic_scope_id, version, effective, approval_id]
      properties:
        id:
          type: string
        source_id:
          type: string
        geographic_scope_id:
          type: string
        version:
          type: string
        effective:
          $ref: '#/components/schemas/DateRange'
        approval_id:
          type: string
    RegistrySourceOverride:
      type: object
      additionalProperties: false
      required: [id, base_source_id, override_source_id, effective, applied_fields, approval_id]
      properties:
        id:
          type: string
        base_source_id:
          type: string
        override_source_id:
          type: string
        effective:
          $ref: '#/components/schemas/DateRange'
        applied_fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        approval_id:
          type: string
    DateRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    AdminIssuePairingRequest:
      type: object
      additionalProperties: false
      required: [expires_in_seconds, reason]
      properties:
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 900
        reason:
          type: string
          minLength: 1
          maxLength: 512
    AdminIssuePairingResponse:
      type: object
      additionalProperties: false
      required: [device_id, pairing_code, expires_at]
      properties:
        device_id:
          type: string
          minLength: 8
          maxLength: 128
        pairing_code:
          type: string
          minLength: 26
          maxLength: 26
          readOnly: true
        expires_at:
          type: string
          format: date-time
    AdminReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
    AdminAssignmentRequest:
      type: object
      additionalProperties: false
      required: [snapshot_id, reason]
      properties:
        snapshot_id:
          type: string
          minLength: 8
          maxLength: 128
        minimum_app_version:
          type: string
          minLength: 1
          maxLength: 64
        reason:
          type: string
          minLength: 1
          maxLength: 512
    AdminRolloutGroupRequest:
      type: object
      additionalProperties: false
      required: [rollout_group, reason]
      properties:
        rollout_group:
          oneOf:
            - const: ''
            - type: string
              minLength: 8
              maxLength: 64
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$'
          description: Empty string removes the device from its cohort.
        reason:
          type: string
          minLength: 1
          maxLength: 512
    FleetDevice:
      type: object
      additionalProperties: false
      required: [device_id, mosque_id, status, created_at]
      properties:
        device_id:
          type: string
          minLength: 8
          maxLength: 128
        mosque_id:
          type: string
          minLength: 8
          maxLength: 128
        status:
          type: string
          enum: [pending, active, revoked]
        app_version:
          type: string
        os_version:
          type: string
        model:
          type: string
        created_at:
          type: string
          format: date-time
        paired_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        snapshot_id:
          type: string
        manifest_version:
          type: integer
          format: int64
          minimum: 1
        last_seen_at:
          type: string
          format: date-time
        reported_snapshot_id:
          type: string
          minLength: 8
          maxLength: 128
        sync_status:
          type: string
          enum: [ok, offline, transient_failure, rejected_snapshot, auth_failure, unknown]
        coverage_days_remaining:
          type: integer
          minimum: 0
          maximum: 732
        clock_mismatch:
          type: boolean
        timezone_mismatch:
          type: boolean
        storage_health:
          type: string
          enum: [ok, low, critical, unknown]
        memory_health:
          type: string
          enum: [ok, low, critical, unknown]
        boot_mode:
          type: string
          enum: [manual, best_effort, managed, unknown]
        kiosk_mode:
          type: string
          enum: [none, best_effort, managed, unknown]
        rollout_group:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$'
    DeviceAssignment:
      type: object
      additionalProperties: false
      required: [device_id, manifest_version, snapshot_id, snapshot_url, snapshot_sha256, signing_key_id]
      properties:
        device_id:
          type: string
          minLength: 8
          maxLength: 128
        manifest_version:
          type: integer
          format: int64
          minimum: 1
        snapshot_id:
          type: string
          minLength: 8
          maxLength: 128
        snapshot_url:
          type: string
          format: uri
        snapshot_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        signing_key_id:
          type: string
          minLength: 1
          maxLength: 128
        minimum_app_version:
          type: string
          minLength: 1
          maxLength: 64
    RolloutAssignmentResult:
      type: object
      additionalProperties: false
      required: [rollout_group, snapshot_id, device_count, assignments]
      properties:
        rollout_group:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$'
        snapshot_id:
          type: string
          minLength: 8
          maxLength: 128
        device_count:
          type: integer
          minimum: 1
          maximum: 100
        assignments:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DeviceAssignment'
    DeviceSupportBundle:
      type: object
      additionalProperties: false
      required: [schema_version, generated_at, mosque, device]
      properties:
        schema_version:
          const: device-support-bundle/v1
        generated_at:
          type: string
          format: date-time
        mosque:
          $ref: '#/components/schemas/SupportMosque'
        device:
          $ref: '#/components/schemas/SupportDevice'
        assignment:
          $ref: '#/components/schemas/SupportAssignment'
        health:
          $ref: '#/components/schemas/SupportHealth'
    SupportMosque:
      type: object
      additionalProperties: false
      required: [id, timezone]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 128
        timezone:
          type: string
          minLength: 3
          maxLength: 64
          description: Named IANA timezone ID; fixed numeric offsets are invalid.
    SupportDevice:
      type: object
      additionalProperties: false
      required: [id, status, created_at]
      properties:
        id:
          type: string
          minLength: 8
          maxLength: 128
        status:
          type: string
          enum: [pending, active, revoked]
        app_version:
          type: string
          minLength: 1
          maxLength: 64
        os_version:
          type: string
          minLength: 1
          maxLength: 128
        model:
          type: string
          minLength: 1
          maxLength: 240
        created_at:
          type: string
          format: date-time
        paired_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        rollout_group:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$'
    SupportAssignment:
      type: object
      additionalProperties: false
      required: [manifest_version, snapshot_id, snapshot_sha256, signing_key_id]
      properties:
        manifest_version:
          type: integer
          format: int64
          minimum: 1
        snapshot_id:
          type: string
          minLength: 8
          maxLength: 128
        snapshot_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        signing_key_id:
          type: string
          minLength: 1
          maxLength: 128
        minimum_app_version:
          type: string
          minLength: 1
          maxLength: 64
    SupportHealth:
      type: object
      additionalProperties: false
      required:
        - reported_at
        - received_at
        - sync_status
        - coverage_days_remaining
        - clock_mismatch
        - timezone_mismatch
        - storage_health
        - memory_health
        - boot_mode
        - kiosk_mode
      properties:
        reported_at:
          type: string
          format: date-time
          description: Device-reported and non-authoritative.
        received_at:
          type: string
          format: date-time
          description: Server-owned receipt timestamp.
        reported_snapshot_id:
          type: string
          minLength: 8
          maxLength: 128
        sync_status:
          type: string
          enum: [ok, offline, transient_failure, rejected_snapshot, auth_failure, unknown]
        coverage_days_remaining:
          type: integer
          minimum: 0
          maximum: 732
        clock_mismatch:
          type: boolean
        timezone_mismatch:
          type: boolean
        storage_health:
          type: string
          enum: [ok, low, critical, unknown]
        memory_health:
          type: string
          enum: [ok, low, critical, unknown]
        boot_mode:
          type: string
          enum: [manual, best_effort, managed, unknown]
        kiosk_mode:
          type: string
          enum: [none, best_effort, managed, unknown]
    PairRequest:
      type: object
      additionalProperties: false
      required: [pairing_code, device]
      properties:
        pairing_code:
          type: string
          minLength: 6
          maxLength: 32
          description: >-
            T011 production codes contain 128 bits of random entropy, expire in
            at most 15 minutes and are returned/stored in plaintext only at the
            issuance boundary.
        installation_public_key:
          type: string
          maxLength: 4096
        device:
          $ref: '#/components/schemas/DeviceInfo'
    PairResponse:
      type: object
      additionalProperties: false
      required: [device_id, device_token, mosque, manifest_url]
      properties:
        device_id:
          type: string
          minLength: 8
          maxLength: 128
        device_token:
          type: string
          writeOnly: true
          minLength: 16
          maxLength: 4096
          description: >-
            Opaque device/mosque-scoped credential returned once. Production
            persistence retains only its SHA-256 verifier.
        manifest_url:
          type: string
          format: uri-reference
          description: Same HTTPS origin as the pairing endpoint after resolution.
        mosque:
          type: object
          additionalProperties: false
          required: [id, name, timezone]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 240
            timezone:
              type: string
              minLength: 3
              maxLength: 64
              description: Named IANA timezone ID; fixed numeric offsets are invalid.
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [app_version, os_version, model]
      properties:
        app_version:
          type: string
          minLength: 1
          maxLength: 64
        os_version:
          type: string
          minLength: 1
          maxLength: 128
        model:
          type: string
          minLength: 1
          maxLength: 240
        capabilities:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    DeviceManifest:
      type: object
      additionalProperties: false
      required:
        - manifest_version
        - snapshot_id
        - snapshot_url
        - snapshot_sha256
        - snapshot_byte_length
        - signing_key_id
      properties:
        manifest_version:
          type: integer
          minimum: 1
        snapshot_id:
          type: string
          minLength: 8
          maxLength: 128
        snapshot_url:
          type: string
          format: uri
          pattern: '^https://'
          description: Must share origin with the authenticated manifest URL in T009.
        snapshot_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        snapshot_byte_length:
          type: integer
          minimum: 1
          maximum: 5242880
        signing_key_id:
          type: string
          minLength: 1
          maxLength: 128
        minimum_app_version:
          type: string
          minLength: 1
          maxLength: 64
        server_time:
          type: string
          format: date-time
        assets:
          type: array
          description: T009 Android rejects a non-empty list until staged asset activation is implemented.
          items:
            $ref: '#/components/schemas/AssetManifestItem'
    AssetManifestItem:
      type: object
      additionalProperties: false
      required: [asset_id, url, sha256, byte_length, media_type]
      properties:
        asset_id:
          type: string
          minLength: 1
          maxLength: 128
        url:
          type: string
          format: uri
          pattern: '^https://'
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        byte_length:
          type: integer
          minimum: 1
          maximum: 20971520
        media_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    Heartbeat:
      type: object
      additionalProperties: false
      required:
        - sent_at
        - app_version
        - os_version
        - model
        - active_snapshot_id
        - sync_status
        - coverage_days_remaining
        - clock_mismatch
        - timezone_mismatch
        - storage_health
        - memory_health
        - boot_mode
        - kiosk_mode
      properties:
        sent_at:
          type: string
          format: date-time
        app_version:
          type: string
          minLength: 1
          maxLength: 64
        os_version:
          type: string
          maxLength: 128
        model:
          type: string
          maxLength: 240
        active_snapshot_id:
          oneOf:
            - const: ''
            - type: string
              minLength: 8
              maxLength: 128
        sync_status:
          type: string
          enum: [ok, offline, transient_failure, rejected_snapshot, auth_failure, unknown]
        coverage_days_remaining:
          type: integer
          minimum: 0
          maximum: 732
        clock_mismatch:
          type: boolean
        timezone_mismatch:
          type: boolean
        storage_health:
          type: string
          enum: [ok, low, critical, unknown]
        memory_health:
          type: string
          enum: [ok, low, critical, unknown]
        boot_mode:
          type: string
          enum: [manual, best_effort, managed, unknown]
        kiosk_mode:
          type: string
          enum: [none, best_effort, managed, unknown]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean

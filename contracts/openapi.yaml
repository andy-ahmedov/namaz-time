          type: string
        authority_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        source_id:
          type: string
        timetable_id:
          type: string
        calculation_profile_id:
          type: string
        mosque_ids:
          type: array
          minItems: 1
          maxItems: 1

android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Kotlin <2.4.20 has an unsafe build-cache metadata deserialization advisory.
# The fixed Kotlin line is prerelease at this checkpoint, so shared/local build
# cache consumption stays disabled until the supported toolchain is upgraded.
org.gradle.caching=false
kotlin.caching.enabled=false
